name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: climashield
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: climashield
        ports: ['54322:5432']
        options: >-
          --health-cmd "pg_isready -U climashield" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://climashield:test-only@localhost:54322/climashield
      DIRECT_URL: postgresql://climashield:test-only@localhost:54322/climashield
      DEMO_COORDINATOR_TOKEN: test-coordinator-not-production
      PORT: 8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:ui
