services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: climashield
      POSTGRES_USER: climashield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climashield_local}
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - climashield-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climashield"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://climashield:${POSTGRES_PASSWORD:-climashield_local}@db:5432/climashield
      DIRECT_URL: postgresql://climashield:${POSTGRES_PASSWORD:-climashield_local}@db:5432/climashield
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 8081
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  climashield-db:

